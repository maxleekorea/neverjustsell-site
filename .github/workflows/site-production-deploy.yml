name: Public site production deploy

on:
  workflow_dispatch:

concurrency:
  group: neverjustsell-public-site-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install site Worker dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Test site Worker
        working-directory: site
        run: npm test
      - name: Deploy site Worker
        working-directory: site
        run: npx wrangler deploy --config wrangler.production.jsonc
      - name: Verify public home and knowledge
        run: |
          node - <<'NODE'
          const homeUrl = "https://www.neverjustsell.com/?check=" + Date.now();
          let homeOk = false;
          for (let i = 0; i < 12; i += 1) {
            const r = await fetch(homeUrl + "&attempt=" + i, { headers: { "Cache-Control": "no-cache" } });
            const body = await r.text();
            const state = {
              brand: body.includes("브랜드와 마케팅을"),
              knowledge_gateway: body.includes('href="/knowledge"'),
              community_gateway: body.includes("community.neverjustsell.com"),
              primary_cta: body.includes("지식에서 시작하기"),
              indexable: !body.includes('content="noindex,nofollow"'),
              obsolete_live_feed_absent: !body.includes("지금 이어지는 질문과 지식")
            };
            console.log(JSON.stringify({ url: homeUrl, attempt: i, status: r.status, bytes: body.length, state }));
            if (r.ok && Object.values(state).every(Boolean)) { homeOk = true; break; }
            await new Promise((resolve) => setTimeout(resolve, 3000));
          }
          if (!homeOk) process.exit(1);

          const knowledgeUrl = "https://www.neverjustsell.com/knowledge?check=" + Date.now();
          let knowledgeOk = false;
          for (let i = 0; i < 12; i += 1) {
            const r = await fetch(knowledgeUrl + "&attempt=" + i, { headers: { "Cache-Control": "no-cache" } });
            const body = await r.text();
            const state = {
              hub: body.includes("NJS KNOWLEDGE HUB"),
              knowledge: body.includes("지식")
            };
            console.log(JSON.stringify({ url: knowledgeUrl, attempt: i, status: r.status, bytes: body.length, state }));
            if (r.ok && Object.values(state).every(Boolean)) { knowledgeOk = true; break; }
            await new Promise((resolve) => setTimeout(resolve, 3000));
          }
          if (!knowledgeOk) process.exit(1);
          NODE
