name: Public site production deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/site-production-deploy.yml"

concurrency:
  group: neverjustsell-public-site-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install site Worker dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Test site Worker
        working-directory: site
        run: npm test
      - name: Deploy site Worker
        working-directory: site
        run: npx wrangler deploy --config wrangler.production.jsonc
      - name: Verify public home and knowledge
        run: |
          node - <<'NODE'
          const checks = [
            ["https://www.neverjustsell.com/?check=" + Date.now(), ["그냥 팔지", "지금 이어지는 질문과 지식", "강의 Q&A", "커뮤니티"]],
            ["https://www.neverjustsell.com/knowledge?check=" + Date.now(), ["NJS KNOWLEDGE HUB", "지식"]]
          ];
          for (const [url, phrases] of checks) {
            let ok = false;
            for (let i = 0; i < 12; i += 1) {
              const r = await fetch(url + "&attempt=" + i, { headers: { "Cache-Control": "no-cache" } });
              const body = await r.text();
              console.log(JSON.stringify({ url, attempt: i, status: r.status, bytes: body.length }));
              if (r.ok && phrases.every((phrase) => body.includes(phrase))) { ok = true; break; }
              await new Promise((resolve) => setTimeout(resolve, 3000));
            }
            if (!ok) process.exit(1);
          }
          NODE
