name: Apply course D1 migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "worker/migrations/**"
      - ".github/workflows/course-d1-migrations.yml"

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund
      - name: Apply remote D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply neverjustsell-courses --remote --config wrangler.jsonc
