name: NJS Cloudflare build isolation

on:
  push:
    branches:
      - ops/njs-execution-router-v0
    paths:
      - "ops/njs_execution_router/isolation_apply.flag"
  workflow_dispatch:

jobs:
  isolate-preview-builds:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restrict Cloudflare preview build watch paths
        run: node ops/njs_execution_router/cloudflare_build_isolation.mjs
