name: Cloudflare domain sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Plan only, or apply the declared domain state"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
  push:
    branches:
      - main
    paths:
      - "cloudflare/apply.flag"

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MODE: ${{ github.event_name == 'push' && 'apply' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile Cloudflare domains
        run: node cloudflare/sync.mjs "$MODE"
