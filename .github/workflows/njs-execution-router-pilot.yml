name: NJS Execution Router Pilot

on:
  push:
    branches:
      - ops/njs-execution-router-v0
    paths:
      - 'ops/njs_execution_router/**'
      - '.github/workflows/njs-execution-router-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s ops/njs_execution_router/tests -v
      - name: Select command
        id: command
        shell: bash
        run: |
          shopt -s nullglob
          files=(ops/njs_execution_router/inbox/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            printf '%s\n' "${files[@]}" | sort | tail -n 1 | sed 's/^/path=/' >> "$GITHUB_OUTPUT"
          else
            echo 'path=ops/njs_execution_router/fixtures/job-20260927-0001.json' >> "$GITHUB_OUTPUT"
          fi
      - name: Execute read-only command
        run: |
          python ops/njs_execution_router/router.py \
            --command "${{ steps.command.outputs.path }}" \
            --registry ops/njs_execution_router/fixtures/action-registry.json \
            --phase SHADOW_ENCODE \
            --output njs-router-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: njs-router-result
          path: njs-router-result.json
