name: P20 Content Engine V1

on:
  push:
    branches:
      - ops/p20-content-engine-v1
    paths:
      - "ops/p20-content-engine-v1/**"
      - ".github/workflows/p20-content-engine-v1.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ops/p20-content-engine-v1/**"
      - ".github/workflows/p20-content-engine-v1.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run, research_only, or full"
        required: true
        default: "dry_run"
        type: choice
        options:
          - dry_run
          - research_only
          - full
      content_id:
        description: "P20 content id"
        required: true
        default: "CNT-000200"
      topic:
        description: "Research/production topic"
        required: true
        default: "네이버-토스 리워드 검색 및 POS 연동 갈등"
      model:
        description: "OpenAI API model for live modes"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ops/p20-content-engine-v1
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ inputs.model || vars.OPENAI_MODEL }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Static validation
        run: |
          python -m py_compile src/p20_v1/*.py
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path("schemas").glob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
              print("schema-ok", p)
          PY

      - name: Run engine
        env:
          PYTHONPATH: src
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="dry_run"; fi
          TOPIC="${{ inputs.topic }}"
          if [ -z "$TOPIC" ]; then TOPIC="CNT-000200 Work regression fixture"; fi
          CONTENT_ID="${{ inputs.content_id }}"
          if [ -z "$CONTENT_ID" ]; then CONTENT_ID="CNT-000200"; fi
          python -m p20_v1.pipeline             --mode "$MODE"             --topic "$TOPIC"             --content-id "$CONTENT_ID"             --run-id "${{ github.run_id }}-${{ github.run_attempt }}"             --out run_output

      - name: Verify dry-run contract
        run: |
          test -f run_output/execution_plan.json
          test -f run_output/run_manifest.json
          test -f run_output/source_pack.sha256
          python - <<'PY'
          import json
          plan=json.load(open("run_output/execution_plan.json", encoding="utf-8"))
          assert plan["source_policy"]["legacy_writer_runtime"] == "RUNTIME_DISABLED"
          assert plan["source_policy"]["source_evidence_reuse"] == "ACTIVE"
          assert plan["context_isolation"]["previous_response_id"] is None
          assert plan["context_isolation"]["writer_web_access"] is False
          assert plan["context_isolation"]["evaluator_web_access"] is False
          print("isolation-contract-pass")
          PY

      - name: Upload run packet
        uses: actions/upload-artifact@v4
        with:
          name: p20-content-engine-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/p20-content-engine-v1/run_output/
          if-no-files-found: error
          retention-days: 30
