name: P20 Content Engine V1
on:
  push:
    branches: [ops/p20-content-engine-v1]
    paths: ["ops/p20-content-engine-v1/**", ".github/workflows/p20-content-engine-v1.yml"]
  pull_request:
    branches: [main]
    paths: ["ops/p20-content-engine-v1/**", ".github/workflows/p20-content-engine-v1.yml"]

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ops/p20-content-engine-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Static validation
        run: |
          python -m py_compile src/p20_v1/*.py
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path("schemas").glob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
              print("schema-ok", p)
          PY
      - name: Gate regression tests
        env: {PYTHONPATH: src}
        run: python -m unittest discover -s tests -v
      - name: Dry-run packet
        env: {PYTHONPATH: src}
        run: |
          python -m p20_v1.pipeline --mode dry_run --topic "CI regression" --content-id CNT-REGRESSION --primary-type D --secondary-type F --out run_output
      - name: Verify gate contract
        run: |
          test -f run_output/work_packet/00_run_state.json
          test -f run_output/work_packet/14_script.md
          python - <<'PY'
          import json
          state=json.load(open("run_output/work_packet/00_run_state.json", encoding="utf-8"))
          assert state["one_shot_full_draft_allowed"] is False
          assert state["persistent_draft"] == "14_script.md"
          assert state["gates"]["production_type"]["status"] == "PASS"
          assert state["gates"]["state_overlap"]["status"] == "READY"
          assert state["gates"]["audience_reality"]["status"] == "LOCKED"
          print("gate-enforcement-contract-pass")
          PY
      - name: Verify one-shot full is blocked
        env: {PYTHONPATH: src}
        run: |
          set +e
          python -m p20_v1.pipeline --mode full --topic "fail closed regression" --content-id CNT-REGRESSION --out full_block_test >full_block.out 2>&1
          RC=$?
          set -e
          test "$RC" -ne 0
          grep -q "ONE_SHOT_FULL_DISABLED" full_block.out
          echo "one-shot-full-block-pass"
