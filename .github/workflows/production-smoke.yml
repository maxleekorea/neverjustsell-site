name: Production cross-domain smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "site/**"
      - "worker/**"
      - "community/**"
      - "tests/**"
      - "docs/ARCHITECTURE_STABILIZATION.md"
      - "docs/USER_ACCESS_MODEL.md"
      - ".github/workflows/production-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "worker/**"
      - "community/**"
      - "tests/**"
      - "docs/ARCHITECTURE_STABILIZATION.md"
      - "docs/USER_ACCESS_MODEL.md"
      - ".github/workflows/production-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public-site boundary contract
        run: node tests/site-contract.mjs
      - name: Verify auth and route ownership contract
        run: node tests/worker-contract.mjs
      - name: Verify login intent and safe return-to contract
        run: node tests/visitor-login-continuity-contract.mjs
      - name: Verify classroom mobile UX contract
        run: node tests/classroom-mobile-ux-contract.mjs
      - name: Verify purchase and entitlement contract
        run: node tests/access-contract.mjs
      - name: Verify roles and course ownership contract
        run: node tests/role-contract.mjs
      - name: Verify program and community contract
        run: node tests/program-community-contract.mjs
      - name: Verify paid course commerce contract
        run: node tests/paid-course-commerce-contract.mjs
      - name: Verify value activity measurement contract
        run: node tests/value-events-contract.mjs
      - name: Verify member continuity contract
        run: node tests/member-continuity-contract.mjs
      - name: Verify Knowledge Ops contract
        run: node tests/knowledge-ops-contract.mjs
      - name: Verify canonical Knowledge fallback contract
        run: node tests/knowledge-runtime-contract.mjs
      - name: Verify canonical Knowledge bootstrap contract
        run: node tests/knowledge-canonical-bootstrap-contract.mjs
      - name: Verify Program V1 participant journey contract
        run: node tests/program-participant-contract.mjs
      - name: Verify Program V1 UX guard contract
        run: node tests/program-ux-guard-contract.mjs
      - name: Verify production release gate contract
        run: node tests/production-release-contract.mjs
      # Public guest screens are captured against LIVE production for comparison.
      # No member or admin cookies, no checkout writes and no automation of login.
      - name: Capture current Cafe24 login entry on PC and mobile
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visitor-login-qa
          printf 'READ-ONLY PRODUCTION guest snapshot. No user login or OAuth callback performed.\n' > visitor-login-qa/ABOUT.txt
          if ! command -v google-chrome >/dev/null; then
            echo 'Chrome is unavailable on this runner' >> visitor-login-qa/ABOUT.txt
            exit 0
          fi
          pages=(
            "login|https://neverjustsell.cafe24.com/member/login.html"
            "myspace|https://classroom.neverjustsell.com/my-space"
            "question|https://community.neverjustsell.com/write?intent=question"
          )
          for width in 390 1440; do
            for item in "${pages[@]}"; do
              label="${item%%|*}"
              target="${item#*|}"
              profile="$(mktemp -d)"
              if timeout 35s google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --hide-scrollbars --window-size="${width},1200" --virtual-time-budget=3500 --user-data-dir="$profile" --screenshot="visitor-login-qa/${label}-${width}.png" "$target" >/dev/null 2>&1; then
                echo "Captured $label $width" >> visitor-login-qa/ABOUT.txt
              else
                echo "Capture unavailable: $label $width" >> visitor-login-qa/ABOUT.txt
              fi
              rm -rf "$profile"
            done
          done
      - name: Save anonymous login screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cafe24-guest-login-mobile-desktop
          path: visitor-login-qa/
          retention-days: 14
          if-no-files-found: ignore
      - name: Verify Worker production bundle
        working-directory: worker
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --config wrangler.production.jsonc
      - name: Verify Community production bundle
        working-directory: community
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --config wrangler.production.jsonc
      - name: Verify current production routes
        if: github.event_name != 'pull_request'
        run: node tests/live-smoke.mjs
      - name: Audit Cafe24 digital product UX
        if: github.event_name != 'pull_request'
        run: node tests/cafe24-digital-ux-audit.mjs
      - name: Crawl launch public site
        if: github.event_name != 'pull_request'
        run: node tests/public-site-crawl.mjs
