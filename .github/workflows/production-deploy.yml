name: Production Workers deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "deploy/production.flag"

concurrency:
  group: neverjustsell-production-workers
  cancel-in-progress: false

jobs:
  deploy-course:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install course Worker dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund
      - name: Deploy course Worker
        working-directory: worker
        run: npx wrangler deploy --config wrangler.production.jsonc
      - name: Inspect Cafe24 Admin OAuth scopes
        run: |
          node -e '
          const r=await fetch("https://classroom.neverjustsell.com/oauth/cafe24/status?deploy_check="+Date.now(),{headers:{"Cache-Control":"no-cache"}});
          const j=await r.json().catch(()=>null);
          console.log(JSON.stringify(j,null,2));
          const scopes=Array.isArray(j?.scopes)?j.scopes:[];
          const storeRead=scopes.includes("mall.read_store");
          const storeWrite=scopes.includes("mall.write_store");
          console.log(JSON.stringify({store_read:storeRead,store_write:storeWrite,scopes},null,2));
          if(!r.ok || !j?.ok || j?.connected!==true || !storeRead || !storeWrite) process.exit(1);
          '

      - name: Inspect payment E2E product before reconciliation
        continue-on-error: true
        run: |
          node -e '
          const r=await fetch("https://classroom.neverjustsell.com/system-check/payment-e2e/status");
          const j=await r.json().catch(()=>null);
          console.log(JSON.stringify(j,null,2));
          '
      - name: Inspect payment E2E customer claim
        run: |
          node -e '
          const r=await fetch("https://classroom.neverjustsell.com/system-check/payment-e2e/claim-status?deploy_check="+Date.now(),{headers:{"Cache-Control":"no-cache"}});
          const j=await r.json().catch(()=>null);
          console.log(JSON.stringify(j,null,2));
          if(!r.ok || !j?.ok || j?.order_detected!==true) process.exit(1);
          '

      - name: Reconcile course schema through runtime binding
        run: |
          node -e '
          const expected="2026-09-26-mobile-learning-ux-v33";
          let last=null;
          for(let i=0;i<8;i+=1){
            const r=await fetch("https://classroom.neverjustsell.com/migration-health?deploy_check="+Date.now(),{headers:{"Cache-Control":"no-cache"}});
            const j=await r.json().catch(()=>null);
            last={status:r.status,body:j};
            console.log(JSON.stringify(last,null,2));
            const first=j?.lesson_discussions?.courses?.["paid-naver-search-algorithm"];
            const second=j?.lesson_discussions?.courses?.["paid-naver-keyword-strategy"];
            if(
              r.ok &&
              j?.ok &&
              j?.production_build===expected &&
              j?.program_schema?.ok &&
              j?.real_paid_course_sync?.ok &&
              j?.lesson_discussions?.ok &&
              Number(j?.lesson_discussions?.total_seed_questions||0)>=23 &&
              Number(j?.lesson_discussions?.total_seed_answers||0)>=23 &&
              Number(first?.question_count||0)>=10 &&
              Number(first?.answered_count||0)>=10 &&
              Number(second?.question_count||0)>=13 &&
              Number(second?.answered_count||0)>=13 &&
              j?.system_operations?.ok &&
              Number(j?.system_operations?.pending_count||0)===0
            ) process.exit(0);
            await new Promise(resolve=>setTimeout(resolve,2000));
          }
          console.error("Course runtime reconciliation did not converge:",JSON.stringify(last));
          process.exit(1);
          '
      - name: Inspect real paid course production state
        run: |
          node -e '
          const r=await fetch("https://classroom.neverjustsell.com/course-admin/health?deploy_check="+Date.now(),{headers:{"Cache-Control":"no-cache"}});
          const j=await r.json().catch(()=>null);
          const courses=Array.isArray(j?.real_paid_courses_check)?j.real_paid_courses_check:[];
          console.log(JSON.stringify({version:j?.version,real_paid_courses_check:courses},null,2));
          const first=courses.find(course=>course?.id==="paid-naver-search-algorithm");
          const second=courses.find(course=>course?.id==="paid-naver-keyword-strategy");
          if(
            !r.ok ||
            !j?.ok ||
            !first ||
            !second ||
            Number(first?.lesson_count)!==10 ||
            Number(first?.video_count)!==10 ||
            Number(first?.ready_count)!==10 ||
            Number(first?.duration_count)!==10 ||
            Number(second?.lesson_count)!==13 ||
            Number(second?.video_count)!==13 ||
            Number(second?.ready_count)!==13 ||
            Number(second?.duration_count)!==13 ||
            courses.some(course=>Number(course?.test_fixture_video_count||0)!==0)
          ) process.exit(1);
          '

      - name: Verify customer cancellation settings
        run: |
          node -e '
          const r=await fetch("https://classroom.neverjustsell.com/system-check/customer-claim-settings?deploy_check="+Date.now(),{headers:{"Cache-Control":"no-cache"}});
          const j=await r.json().catch(()=>null);
          console.log(JSON.stringify(j,null,2));
          const exposure=Array.isArray(j?.claim_request_button_exposure)?j.claim_request_button_exposure:[];
          const expectedExposure=["cancel_N20","cancel_N22","cancel_N21"];
          if(j?.use_product_prepare_status==="T") expectedExposure.unshift("cancel_N10");
          const invalidN10=j?.use_product_prepare_status!=="T" && exposure.includes("cancel_N10");
          if(
            !r.ok ||
            !j?.ok ||
            j?.configured!==true ||
            j?.claim_request!=="T" ||
            j?.claim_request_type!=="S" ||
            j?.claim_request_button_date_type!=="order_date" ||
            Number(j?.claim_request_button_period)!==7 ||
            j?.claim_request_auto_accept!=="F" ||
            j?.refund_bank_account_required!=="T" ||
            j?.refund_processing_setting!=="D" ||
            !expectedExposure.every(code=>exposure.includes(code)) ||
            invalidN10 ||
            exposure.some(code=>code.startsWith("exchange_")||code.startsWith("return_"))
          ) process.exit(1);
          '

      - name: Verify Cafe24 claim state without custom refund mutation
        run: |
          node -e '
          const r=await fetch("https://classroom.neverjustsell.com/system-check/payment-e2e/claim-status?deploy_check="+Date.now(),{headers:{"Cache-Control":"no-cache"}});
          const j=await r.json().catch(()=>null);
          console.log(JSON.stringify(j,null,2));
          const accepted=["C00","C10","C34","C35","C36","C40","C41","C42","C43"].includes(String(j?.item_order_status||""));
          if(!r.ok || !j?.ok || j?.order_id!=="20260925-0000013" || !accepted) process.exit(1);
          '

      - name: Verify paid E2E order and access state
        run: |
          node -e '
          const r=await fetch("https://classroom.neverjustsell.com/system-check/payment-e2e/flow-status?deploy_check="+Date.now(),{headers:{"Cache-Control":"no-cache"}});
          const j=await r.json().catch(()=>null);
          console.log(JSON.stringify(j,null,2));
          const active=
            j?.order_state==="active" &&
            j?.course_entitlement==="active" &&
            j?.program_enrollment==="active";
          const revoked=
            j?.order_state==="revoked" &&
            j?.course_entitlement==="revoked" &&
            j?.program_enrollment==="withdrawn";
          if(
            !r.ok ||
            !j?.ok ||
            j?.order_detected!==true ||
            j?.paid_member_order!==true ||
            j?.payment_method!=="cash" ||
            j?.identity_consistent!==true ||
            j?.access_state_consistent!==true ||
            (!active && !revoked)
          ) process.exit(1);
          '
      - name: Verify payment E2E product is closed after reconciliation
        run: |
          node -e '
          let last=null;
          for(let i=0;i<6;i+=1){
            const r=await fetch("https://classroom.neverjustsell.com/system-check/payment-e2e/status?deploy_check="+Date.now(),{headers:{"Cache-Control":"no-cache"}});
            const j=await r.json().catch(()=>null);
            last={status:r.status,body:j};
            console.log(JSON.stringify(last,null,2));
            if(r.ok && j?.ok && Number(j?.price_krw)===1000 && j?.display==="F" && j?.selling==="F") process.exit(0);
            await new Promise(resolve=>setTimeout(resolve,1000));
          }
          console.error("Payment E2E product did not remain closed:",JSON.stringify(last));
          process.exit(1);
          '
      - name: Verify Cafe24 catalog bootstrap
        run: |
          node -e '
          const r=await fetch("https://classroom.neverjustsell.com/system-check/catalog-status?deploy_check="+Date.now(),{headers:{"Cache-Control":"no-cache"}});
          const j=await r.json().catch(()=>null);
          console.log(JSON.stringify(j,null,2));
          if(
            !r.ok ||
            !j?.ok ||
            j?.all_categories_present!==true ||
            j?.product_13_in_course!==true ||
            j?.duplicates_present!==false
          ) process.exit(1);
          '
      - name: Verify all current products use no shipping
        run: |
          node -e '
          const r=await fetch("https://classroom.neverjustsell.com/system-check/shipping-status?deploy_check="+Date.now(),{headers:{"Cache-Control":"no-cache"}});
          const j=await r.json().catch(()=>null);
          console.log(JSON.stringify(j,null,2));
          if(
            !r.ok ||
            !j?.ok ||
            j?.product_count<1 ||
            j?.all_no_shipping!==true
          ) process.exit(1);
          '
      - name: Verify digital product detail hides shipping properties
        run: |
          node -e '
          const r=await fetch("https://classroom.neverjustsell.com/system-check/product-detail-properties-status?deploy_check="+Date.now(),{headers:{"Cache-Control":"no-cache"}});
          const j=await r.json().catch(()=>null);
          console.log(JSON.stringify(j,null,2));
          if(
            !r.ok ||
            !j?.ok ||
            j?.shipping_property_count<1 ||
            j?.all_shipping_properties_hidden!==true
          ) process.exit(1);
          '
      - name: Verify digital product detail UX profile
        run: |
          node -e '
          const r=await fetch("https://classroom.neverjustsell.com/system-check/digital-product-ux-status?deploy_check="+Date.now(),{headers:{"Cache-Control":"no-cache"}});
          const j=await r.json().catch(()=>null);
          console.log(JSON.stringify(j,null,2));
          if(
            !r.ok ||
            !j?.ok ||
            j?.digital_product_count<1 ||
            j?.all_digital_ux_applied!==true
          ) process.exit(1);
          '

  deploy-community:
    needs: deploy-course
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install community Worker dependencies
        working-directory: community
        run: npm install --no-audit --no-fund
      - name: Deploy community Worker
        working-directory: community
        run: npx wrangler deploy --config wrangler.production.jsonc
      - name: Reconcile community schema through runtime binding
        run: |
          node -e '
          const r=await fetch("https://community.neverjustsell.com/auth/db-health");
          const j=await r.json().catch(()=>null);
          console.log(JSON.stringify(j,null,2));
          if(!r.ok || !j?.ok || !j?.program_schema?.ok) process.exit(1);
          '
      - name: Verify Program space access matches purchase state
        run: |
          node -e '
          const r=await fetch("https://community.neverjustsell.com/auth/payment-e2e-space-status?deploy_check="+Date.now(),{headers:{"Cache-Control":"no-cache"}});
          const j=await r.json().catch(()=>null);
          console.log(JSON.stringify(j,null,2));
          const withdrawn=
            j?.source_program_enrollment==="withdrawn" &&
            Number(j?.community_accessible_space_count||0)===0 &&
            Number(j?.community_revoked_space_count||0)>=1;
          if(
            !r.ok ||
            !j?.ok ||
            j?.logged_in_once!==true ||
            j?.access_consistent!==true ||
            !withdrawn
          ) process.exit(1);
          '

  verify:
    needs: deploy-community
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production routes after deployment
        run: node tests/live-smoke.mjs
      - name: Crawl public site after deployment
        run: node tests/public-site-crawl.mjs
