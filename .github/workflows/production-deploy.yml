name: Production Workers deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "deploy/production.flag"

concurrency:
  group: neverjustsell-production-workers
  cancel-in-progress: false

jobs:
  deploy-course:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install course Worker dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund
      - name: Deploy course Worker
        working-directory: worker
        run: npx wrangler deploy --config wrangler.production.jsonc
      - name: Inspect payment E2E product before reconciliation
        run: |
          node -e '
          const r=await fetch("https://classroom.neverjustsell.com/system-check/payment-e2e/status");
          const j=await r.json().catch(()=>null);
          console.log(JSON.stringify(j,null,2));
          '
      - name: Reconcile course schema through runtime binding
        run: |
          node -e '
          const r=await fetch("https://classroom.neverjustsell.com/migration-health");
          const j=await r.json().catch(()=>null);
          console.log(JSON.stringify(j,null,2));
          if(!r.ok || !j?.ok || !j?.program_schema?.ok || !j?.system_operations?.ok || Number(j?.system_operations?.pending_count || 0) !== 0) process.exit(1);
          '

  deploy-community:
    needs: deploy-course
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install community Worker dependencies
        working-directory: community
        run: npm install --no-audit --no-fund
      - name: Deploy community Worker
        working-directory: community
        run: npx wrangler deploy --config wrangler.production.jsonc
      - name: Reconcile community schema through runtime binding
        run: |
          node -e '
          const r=await fetch("https://community.neverjustsell.com/auth/db-health");
          const j=await r.json().catch(()=>null);
          console.log(JSON.stringify(j,null,2));
          if(!r.ok || !j?.ok || !j?.program_schema?.ok) process.exit(1);
          '

  verify:
    needs: deploy-community
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production routes after deployment
        run: node tests/live-smoke.mjs
      - name: Crawl public site after deployment
        run: node tests/public-site-crawl.mjs
