name: Cloudflare live diagnose
on:
  push:
    branches: [main]
    paths:
      - "cloudflare/diagnose.flag"
jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node cloudflare/diagnose.mjs
