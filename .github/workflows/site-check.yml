name: Unified site checks

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-check.yml"
  push:
    branches:
      - main
      - site-unification
    paths:
      - "site/**"
      - ".github/workflows/site-check.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Verify existing P30 QA inventory parser
        run: |
          node scripts/p30-qa-summary.mjs --self-test
          node scripts/p30-qa-summary.mjs --inventory
      - name: Execute existing safe P30 QA tests
        run: node scripts/p30-qa-summary.mjs --run
      - name: Preserve P30 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p30-qa-summary-safe
          path: screenshots/p30-test-summary-safe.json
          if-no-files-found: warn
