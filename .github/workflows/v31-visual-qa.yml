name: NJS V3.1 visual QA

on:
  push:
    branches:
      - "design/njs-v31-restructure"
  pull_request:
    paths:
      - "site/src/v31.js"
      - "site/public/v31.css"
      - "site/src/runtime.js"
      - "site/v31-preview-server.mjs"
      - ".github/workflows/v31-visual-qa.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start local V3.1 preview
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          node v31-preview-server.mjs > /tmp/v31-preview.log 2>&1 &
          echo $! > /tmp/v31-preview.pid
          for i in $(seq 1 20); do
            page="$(curl -fsSL http://127.0.0.1:8789/v31 || true)"
            if [[ "$page" == *"v31-ia-02"* && "$page" == *"지식은 정리해서 남기고"* ]]; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/v31-preview.log
          exit 1

      - name: Capture pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots
          common=(--headless --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=4000)
          pages=(home:/v31 content:/v31/content knowledge:/v31/knowledge about:/v31/about book:/v31/book lecture:/v31/lecture)
          for item in "${pages[@]}"; do
            name="${item%%:*}"
            path="${item#*:}"
            google-chrome "${common[@]}" --window-size=1440,5000 --screenshot="screenshots/${name}-desktop.png" "http://127.0.0.1:8789$path"
            google-chrome "${common[@]}" --window-size=390,7000 --screenshot="screenshots/${name}-mobile.png" "http://127.0.0.1:8789$path"
          done
          file screenshots/*.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: njs-v31-visual-qa
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 7
