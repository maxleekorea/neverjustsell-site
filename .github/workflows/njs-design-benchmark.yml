name: NJS design benchmark capture

on:
  push:
    branches:
      - "research/njs-design-benchmark"
    paths:
      - "research/design-benchmark/**"
      - ".github/workflows/njs-design-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser automation dependency
        run: python -m pip install --quiet selenium
      - name: Capture benchmark sites and computed typography
        working-directory: research/design-benchmark
        run: python benchmark.py
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: njs-design-benchmark
          path: research/design-benchmark/benchmark-output/**
          if-no-files-found: error
          retention-days: 7
