name: Cloudflare domain plan

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/plan.flag"

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plan Cloudflare domain reconciliation
        run: node cloudflare/sync.mjs plan
